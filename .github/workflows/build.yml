name: Build Android APK

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DirectCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DirectCast-debug
          path: DirectCast.apk

      # Свежий APK по постоянной ссылке (скачивается без входа в GitHub):
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/DirectCast.apk
      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DirectCast.apk \
            --title "DirectCast — последняя сборка" \
            --notes "Автоматическая сборка из ветки main, коммит ${GITHUB_SHA::7}. Установите один и тот же APK на телефон и на проектор."

      # Журнал сборки в отдельную ветку ci-logs: удобно смотреть причину, если сборка упала.
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "status: ${{ job.status }}"
            echo "time: $(date -u +%FT%TZ)"
            echo
            grep -E "^(e: |w: |FAILURE|\* What went wrong|BUILD )|error:|Exception" "${GITHUB_WORKSPACE}/build.log" | head -80 || true
            echo
            echo "----- tail -----"
            tail -n 60 "${GITHUB_WORKSPACE}/build.log" || true
          } > last-build.txt
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add last-build.txt
          git commit -q -m "build log ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
