plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Постоянный debug-ключ, чтобы новые сборки ставились ПОВЕРХ старых без удаления приложения.
// Ключ хранится в репозитории в текстовом виде (base64) и распаковывается перед сборкой.
def keystoreB64 = rootProject.file('signing/directcast-debug.keystore.b64')
def keystoreFile = rootProject.file('signing/directcast-debug.keystore')
if (keystoreB64.exists() && !keystoreFile.exists()) {
    keystoreFile.bytes = java.util.Base64.getMimeDecoder().decode(keystoreB64.text)
}

android {
    namespace 'com.directcast'
    compileSdk 35

    defaultConfig {
        applicationId 'com.directcast'
        minSdk 23
        targetSdk 32
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        debug {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
